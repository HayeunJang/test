<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VUI Interaction Experiment</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css">
  <script src="https://unpkg.com/jspsych@8.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.0.0"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #jspsych-target {
      max-width: 800px;
      margin: 0 auto;
    }
    .recording-container {
      text-align: center;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    .vui-image {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }
    .guideline-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
      border-radius: 5px;
    }
    .guideline-box h4 {
      margin-top: 0;
      color: #667eea;
    }
    .recording-status {
      font-size: 20px;
      margin: 20px 0;
      min-height: 30px;
    }
    .recording-active {
      color: #dc3545;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
    .timer {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }
    .control-buttons {
      margin-top: 30px;
    }
    .control-buttons button {
      font-size: 18px;
      padding: 15px 40px;
      margin: 0 10px;
      cursor: pointer;
    }
    .record-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .record-btn:hover:not(:disabled) {
      background-color: #c82333;
    }
    .stop-btn {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .stop-btn:hover:not(:disabled) {
      background-color: #218838;
    }
    .next-btn {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .next-btn:hover:not(:disabled) {
      background-color: #0069d9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .rating-prompt {
      margin: 20px 0;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
    }
    .rating-prompt h4 {
      margin-top: 0;
      color: #333;
    }
    .multiple-choice-section {
      margin: 30px 0;
      padding: 20px;
      background: #f0f8ff;
      border-radius: 5px;
      border: 2px solid #667eea;
    }
    .multiple-choice-section h4 {
      margin-top: 0;
      color: #667eea;
    }
    .choice-option {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
      display: block;
    }
    .choice-option:hover {
      background: #e6f2ff;
    }
    .choice-option input[type="radio"] {
      margin-right: 10px;
    }
    .recording-section {
      margin-top: 30px;
      padding: 20px;
      background: #fff3cd;
      border-radius: 5px;
      border: 2px solid #ffc107;
      display: none;
    }
    .recording-section.visible {
      display: block;
    }
    .recording-section h4 {
      margin-top: 0;
      color: #856404;
    }
    .record-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }
    .record-btn-main {
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 15px 30px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .stop-btn-main {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 15px 30px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .record-btn-main:disabled, .stop-btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  
  <script>
    /******************************************************
     * VUI Interaction Experiment
     ******************************************************/

    console.log('Script starting...');

    /* ===== CONFIG ===== */
    const GAS_ENDPOINT_RATING = 'https://script.google.com/macros/s/AKfycbynkEwPJ19e8QGs1w4_TakbVLb3SG5aVXNN2_w0yFi8A-KZQAc0olhIpr3jquyNn7cIrA/exec';
    const GAS_ENDPOINT_RECORDING = 'https://script.google.com/macros/s/AKfycbzH6zFAwQjJ9ekXi_3m_XL852zxY0CDxktTshak8P47mf9VazFIBjPAvM0RfRhwaUUb/exec';

    /* ===== STIMULI ===== */
    const STIMULI = [
      { file: 'audio/c11.wav' },
      { file: 'audio/c12.wav' },
      { file: 'audio/c21.wav' },
      { file: 'audio/c22.wav' }
    ];

    const INTRO_AUDIO = 'audio/intro.wav';

    /* ===== GLOBAL STATE ===== */
    let participantId = null;
    let demographicsData = null;
    let currentTrialStartTime = null;
    let responseRecordingChunks = [];
    let responseMediaRecorder = null;
    
    // Store data that will be saved in on_finish
    let trialDataStore = {};

    /* ===== INIT ===== */
    let jsPsych;
    try {
      jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        on_finish: async () => {
          console.log('Experiment finished');
          const ok = await uploadAllRowsToGoogle();
          if (!ok) {
            const csv = jsPsych.data.get().csv();
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; 
            a.download = 'data_fallback.csv';
            a.textContent = 'Download CSV (upload failed)';
            a.style.display = 'block';
            a.style.margin = '20px auto';
            a.style.textAlign = 'center';
            document.body.appendChild(a);
          }
        }
      });
      console.log('jsPsych initialized:', jsPsych);
    } catch (error) {
      console.error('jsPsych init error:', error);
    }

    /* ===== PRELOAD ===== */
    const audioFiles = STIMULI.map(s => s.file);
    if (INTRO_AUDIO) audioFiles.unshift(INTRO_AUDIO);

    const preload = {
      type: jsPsychPreload,
      audio: audioFiles,
      on_success: () => console.log('Preload success'),
      on_error: (file) => console.error('Preload error:', file)
    };

    /* ===== WELCOME ===== */
    const welcome = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h2>VUI 상호작용 실험에 오신 것을 환영합니다</h2>
                 <p>이 실험에서는 음성 인터페이스의 응답을 듣고 평가하게 됩니다.</p>
                 <p>실험은 약 10분 정도 소요됩니다.</p>`,
      choices: ['시작하기']
    };

    /* ===== DEMOGRAPHICS ===== */
    const demographics = {
      type: jsPsychSurveyHtmlForm,
      html: `
        <div style="max-width: 500px; margin: 0 auto;">
          <h3>기본 정보</h3>
          <p><label>성별:<br>
            <select name="gender" required style="width:100%; padding:8px;">
              <option value="">선택하세요</option>
              <option value="남성">남성</option>
              <option value="여성">여성</option>
              <option value="기타">기타</option>
            </select>
          </label></p>
          <p><label>출생연도:<br>
            <input type="number" name="birth_year" min="1900" max="2024" required style="width:100%; padding:8px;">
          </label></p>
          <p><label>출생월:<br>
            <input type="number" name="birth_month" min="1" max="12" required style="width:100%; padding:8px;">
          </label></p>
          <p><label>모국어:<br>
            <input type="text" name="native_lang" required style="width:100%; padding:8px;">
          </label></p>
          <p><label>방언 (예: 서울, 경상도, 전라도 등):<br>
            <input type="text" name="dialect" required style="width:100%; padding:8px;">
          </label></p>
        </div>
      `,
      button_label: '다음',
      on_finish: (data) => {
        data.task = 'demographics';
        participantId = 'P' + Date.now();
        demographicsData = data.response;
        console.log('Demographics collected:', data.response);
      }
    };

    /* ===== MIC PERMISSION ===== */
    const mic_permission = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h3>마이크 권한 요청</h3>
                 <p>이 실험에서는 음성 녹음이 필요합니다.</p>
                 <p>다음 버튼을 누르면 마이크 권한을 요청합니다.</p>`,
      choices: ['마이크 권한 허용'],
      on_finish: async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
          console.log('Mic permission granted');
        } catch (e) {
          console.error('Mic permission denied:', e);
          alert('마이크 권한이 필요합니다. 브라우저 설정에서 마이크 권한을 허용해주세요.');
        }
      }
    };

    /* ===== INTRO PAGE ===== */
    const intro_page = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h3>실험 안내</h3>
                 <p>각 시행에서 다음 단계를 진행합니다:</p>
                 <ol style="text-align:left; max-width:600px; margin:0 auto;">
                   <li>음성 응답을 듣습니다</li>
                   <li>두 가지 질문에 대해 평가합니다</li>
                   <li>대응 발화를 선택하고 녹음합니다</li>
                 </ol>
                 <p style="margin-top:20px;">준비가 되면 시작 버튼을 눌러주세요.</p>`,
      choices: ['실험 시작']
    };

    /* ===== RECORDING FUNCTIONS ===== */
    async function startResponseRecording() {
      responseRecordingChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      responseMediaRecorder = new MediaRecorder(stream);

      responseMediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          responseRecordingChunks.push(e.data);
        }
      };

      responseMediaRecorder.start();
      return new Promise((resolve) => {
        responseMediaRecorder.onstart = resolve;
      });
    }

    function stopResponseRecording() {
      return new Promise((resolve) => {
        responseMediaRecorder.onstop = resolve;
        responseMediaRecorder.stop();
        responseMediaRecorder.stream.getTracks().forEach(track => track.stop());
      });
    }

    async function convertWebMToWav(webmBlob) {
      const arrayBuffer = await webmBlob.arrayBuffer();
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

      const numberOfChannels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const length = audioBuffer.length * numberOfChannels * 2;

      const buffer = new ArrayBuffer(44 + length);
      const view = new DataView(buffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + length, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numberOfChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numberOfChannels * 2, true);
      view.setUint16(32, numberOfChannels * 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, length, true);

      const channelData = [];
      for (let i = 0; i < numberOfChannels; i++) {
        channelData.push(audioBuffer.getChannelData(i));
      }

      let offset = 44;
      for (let i = 0; i < audioBuffer.length; i++) {
        for (let channel = 0; channel < numberOfChannels; channel++) {
          const sample = Math.max(-1, Math.min(1, channelData[channel][i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    async function uploadResponseRecording(wavBlob, stimulusPath, trialIndex) {
      try {
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(wavBlob);
        });

        const payload = {
          participantId: participantId,
          trialIndex: trialIndex,
          stimulus: stimulusPath,
          timestamp: new Date().toISOString(),
          audioData: base64
        };

        await fetch(GAS_ENDPOINT_RECORDING, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        console.log('Recording uploaded successfully');
        return true;
      } catch (err) {
        console.error('Recording upload error:', err);
        return false;
      }
    }

    /* ===== RATING TRIAL ===== */
    const rating_trial = {
      type: jsPsychSurveyHtmlForm,
      html: function() {
        const audioPath = jsPsych.timelineVariable('file');
        
        return `
          <div style="max-width: 800px; margin: 0 auto; text-align: center;">
            <h3>음성 응답 평가</h3>
            
            <div class="vui-image">🎙️</div>
            
            <div style="margin: 30px 0;">
              <button id="playBtn" type="button"
                style="font-size: 18px; padding: 15px 40px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">
                ▶️ 음성 재생
              </button>
              <div id="audioStatus" style="margin-top: 15px; min-height: 24px; color: #666;"></div>
            </div>
            <audio id="trialAudio" preload="auto" style="display:none;">
              <source src="${audioPath}" type="audio/wav">
            </audio>

            <div class="rating-prompt">
              <h4>1. 이 음성이 얼마나 귀엽게 들리나요?</h4>
              <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0;">
                <span>전혀 귀엽지 않음</span>
                <input type="range" id="slider1" name="cuteness" min="1" max="7" value="4" 
                  style="width: 300px; cursor: pointer;">
                <span>매우 귀여움</span>
              </div>
              <div id="slider1Value" style="font-size: 18px; font-weight: bold; color: #667eea;">4</div>
            </div>

            <div class="rating-prompt">
              <h4>2. 이 음성과 대화를 계속하고 싶나요?</h4>
              <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0;">
                <span>전혀 그렇지 않음</span>
                <input type="range" id="slider2" name="continue" min="1" max="7" value="4" 
                  style="width: 300px; cursor: pointer;">
                <span>매우 그러함</span>
              </div>
              <div id="slider2Value" style="font-size: 18px; font-weight: bold; color: #667eea;">4</div>
            </div>

            <div class="multiple-choice-section">
              <h4>3. 이 음성에 어떻게 대응하시겠습니까?</h4>
              <div style="text-align: left; max-width: 600px; margin: 20px auto;">
                <label class="choice-option">
                  <input type="radio" name="response_choice" id="choice1" value="choice1" required>
                  그만둬
                </label>
                <label class="choice-option">
                  <input type="radio" name="response_choice" id="choice2" value="choice2">
                  계속해
                </label>
                <label class="choice-option">
                  <input type="radio" name="response_choice" id="choice3" value="choice3">
                  그만해
                </label>
                <label class="choice-option">
                  <input type="radio" name="response_choice" id="choice4" value="choice4">
                  계속하세요
                </label>
                <label class="choice-option">
                  <input type="radio" name="response_choice" id="choice5" value="choice5">
                  기타 (직접 입력):
                </label>
                <input type="text" id="otherText" name="other_text" placeholder="여기에 입력하세요" 
                  style="width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px;" disabled>
              </div>
            </div>

            <div class="recording-section" id="recordingSection">
              <h4>🎤 음성 녹음</h4>
              <div id="selectedResponse" style="font-size: 16px; margin: 15px 0; padding: 15px; background: white; border-radius: 4px; min-height: 40px;">
                위에서 응답을 선택해주세요
              </div>
              <div class="record-controls">
                <button id="recordBtn" type="button" class="record-btn-main" disabled>
                  🔴 녹음 시작
                </button>
                <button id="stopBtn" type="button" class="stop-btn-main" disabled>
                  ⏹️ 녹음 종료
                </button>
              </div>
              <div id="recordStatus" style="margin-top: 15px; min-height: 24px;"></div>
              <div id="recordTimer" style="font-size: 20px; font-weight: bold; margin-top: 10px;"></div>
            </div>
          </div>
        `;
      },
      button_label: '다음',
      on_load: function() {
        currentTrialStartTime = new Date().toISOString();
        const audioPath = jsPsych.timelineVariable('file');
        
        // Initialize trialDataStore for this trial
        trialDataStore = {
          slider1Value: 4,
          slider2Value: 4,
          responseChoice: null,
          otherText: ''
        };
        
        // State tracking
        window.trialState = {
          audioPlayed: false,
          slider1Moved: false,
          slider2Moved: false,
          choiceSelected: false,
          recordingCompleted: false
        };
        
        let recordingInProgress = false;
        let timerInterval = null;
        
        // Hide submit button initially
        const submitBtn = document.querySelector('#jspsych-survey-html-form-next');
        if (submitBtn) submitBtn.style.display = 'none';
        
        const audioElement = document.getElementById('trialAudio');
        const playBtn = document.getElementById('playBtn');
        const audioStatus = document.getElementById('audioStatus');
        const recordingSection = document.getElementById('recordingSection');
        const selectedResponseDiv = document.getElementById('selectedResponse');
        const otherTextInput = document.getElementById('otherText');
        
        const responseTexts = {
          'choice1': '그만둬',
          'choice2': '계속해',
          'choice3': '그만해',
          'choice4': '계속하세요'
        };
        
        // Audio play handler
        playBtn.addEventListener('click', () => {
          playBtn.disabled = true;
          audioStatus.textContent = '재생 중...';
          audioStatus.style.color = '#667eea';
          
          audioElement.play();
        });
        
        audioElement.addEventListener('ended', () => {
          audioStatus.textContent = '✅ 재생 완료';
          audioStatus.style.color = '#28a745';
          playBtn.disabled = false;
          playBtn.textContent = '🔁 다시 듣기';
          
          window.trialState.audioPlayed = true;
          checkSubmitReady();
        });
        
        audioElement.addEventListener('error', (e) => {
          audioStatus.textContent = '❌ 재생 오류';
          audioStatus.style.color = '#dc3545';
          playBtn.disabled = false;
          console.error('Audio error:', e);
        });
        
        // Slider handlers - wait for DOM
        setTimeout(() => {
          const slider1 = document.getElementById('slider1');
          const slider2 = document.getElementById('slider2');
          const slider1Value = document.getElementById('slider1Value');
          const slider2Value = document.getElementById('slider2Value');
          
          if (slider1) {
            slider1.addEventListener('input', () => {
              slider1Value.textContent = slider1.value;
              trialDataStore.slider1Value = parseInt(slider1.value);
              window.trialState.slider1Moved = true;
              checkSubmitReady();
            });
          }
          
          if (slider2) {
            slider2.addEventListener('input', () => {
              slider2Value.textContent = slider2.value;
              trialDataStore.slider2Value = parseInt(slider2.value);
              window.trialState.slider2Moved = true;
              checkSubmitReady();
            });
          }
        }, 100);
        
        // Radio button listeners
        const radioButtons = document.querySelectorAll('input[name="response_choice"]');
        radioButtons.forEach(radio => {
          radio.addEventListener('change', (e) => {
            window.trialState.choiceSelected = true;
            trialDataStore.responseChoice = e.target.value;
            recordingSection.classList.add('visible');
            
            const recordBtn = document.getElementById('recordBtn');
            
            if (e.target.id === 'choice5') {
              otherTextInput.disabled = false;
              selectedResponseDiv.textContent = '아래 입력란에 말할 내용을 입력하고 녹음해주세요';
              recordBtn.disabled = otherTextInput.value.trim() === '';
            } else {
              otherTextInput.disabled = true;
              otherTextInput.value = '';
              trialDataStore.otherText = '';
              selectedResponseDiv.textContent = `다음 내용을 말해주세요: ${responseTexts[e.target.id]}`;
              recordBtn.disabled = false;
            }
            
            if (submitBtn) submitBtn.style.display = 'none';
            
            recordingSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            checkSubmitReady();
          });
        });
        
        // Other text input handler
        otherTextInput.addEventListener('input', () => {
          const recordBtn = document.getElementById('recordBtn');
          const choice5 = document.getElementById('choice5');
          trialDataStore.otherText = otherTextInput.value;
          
          if (choice5 && choice5.checked) {
            recordBtn.disabled = otherTextInput.value.trim() === '';
            if (otherTextInput.value.trim() !== '') {
              selectedResponseDiv.textContent = `다음 내용을 말해주세요: "${otherTextInput.value}"`;
            }
          }
        });
        
        // Check if submit ready
        function checkSubmitReady() {
          const submitBtn = document.querySelector('#jspsych-survey-html-form-next');
          
          console.log('Check submit ready:', window.trialState);
          
          if (window.trialState.audioPlayed && 
              window.trialState.slider1Moved && 
              window.trialState.slider2Moved && 
              window.trialState.choiceSelected && 
              window.trialState.recordingCompleted) {
            if (submitBtn) {
              submitBtn.style.display = 'inline-block';
              console.log('✅ Submit button enabled');
            }
          } else {
            if (submitBtn) {
              submitBtn.style.display = 'none';
            }
          }
        }
        
        // Recording handlers
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        recordBtn.addEventListener('click', async () => {
          if (recordingInProgress) return;
          
          const recordStatus = document.getElementById('recordStatus');
          const recordTimer = document.getElementById('recordTimer');
          
          try {
            await startResponseRecording();
            recordingInProgress = true;
            
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            recordStatus.textContent = '🔴 녹음 중...';
            recordStatus.style.color = '#dc3545';
            
            let seconds = 0;
            recordTimer.textContent = '0초';
            timerInterval = setInterval(() => {
              seconds++;
              recordTimer.textContent = `${seconds}초`;
            }, 1000);
            
            console.log('Recording started');
          } catch (err) {
            console.error('Recording start error:', err);
            alert('녹음 시작 실패: ' + err.message);
          }
        });
        
        stopBtn.addEventListener('click', async () => {
          if (!recordingInProgress) return;
          
          const recordStatus = document.getElementById('recordStatus');
          
          stopBtn.disabled = true;
          recordStatus.textContent = '처리 중...';
          recordStatus.style.color = '#666';
          
          try {
            await stopResponseRecording();
            recordingInProgress = false;
            
            if (timerInterval) {
              clearInterval(timerInterval);
              timerInterval = null;
            }
            
            console.log('Recording stopped, chunks:', responseRecordingChunks.length);
            
            if (responseRecordingChunks.length > 0) {
              recordStatus.textContent = '변환 중...';
              
              const webmBlob = new Blob(responseRecordingChunks, { type: 'audio/webm' });
              const wavBlob = await convertWebMToWav(webmBlob);
              
              recordStatus.textContent = '업로드 중...';
              
              const success = await uploadResponseRecording(wavBlob, audioPath, jsPsych.data.get().count());
              
              if (success) {
                recordStatus.textContent = '✅ 녹음 완료!';
                recordStatus.style.color = '#28a745';
                window.trialState.recordingCompleted = true;
                checkSubmitReady();
              } else {
                recordStatus.textContent = '⚠️ 업로드 실패 (계속 진행 가능)';
                recordStatus.style.color = '#ffc107';
                window.trialState.recordingCompleted = true;
                checkSubmitReady();
              }
            } else {
              recordStatus.textContent = '⚠️ 녹음 데이터 없음';
              recordStatus.style.color = '#ffc107';
            }
            
          } catch (err) {
            console.error('Recording stop error:', err);
            recordStatus.textContent = '❌ 오류: ' + err.message;
            recordStatus.style.color = '#dc3545';
          }
        });
      },
      on_finish: (data) => {
        // Use stored data instead of trying to access DOM
        data.task = 'rating';
        data.stimulus = jsPsych.timelineVariable('file');
        data.cuteness_rating = trialDataStore.slider1Value;
        data.continue_conversation = trialDataStore.slider2Value;
        data.response_choice = trialDataStore.responseChoice || 'none';
        data.other_text = trialDataStore.otherText || '';
        data.trial_start_time = currentTrialStartTime;
        data.response_time = new Date().toISOString();
        data.user_agent = navigator.userAgent;
        data.participant_id = participantId;
        
        console.log('Trial finished:', {
          stimulus: data.stimulus,
          cuteness_rating: data.cuteness_rating,
          continue_conversation: data.continue_conversation,
          response_choice: data.response_choice,
          other_text: data.other_text
        });
      }
    };

    /* ===== RATING BLOCK ===== */
    const rating_block = {
      timeline: [rating_trial],
      timeline_variables: STIMULI,
      randomize_order: true
    };

    /* ===== END ===== */
    const end = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h2>감사합니다!</h2>
                 <p>실험이 완료되었습니다.</p>
                 <p>모든 데이터가 저장되었습니다.</p>`,
      choices: ['종료']
    };

    /* ===== GOOGLE UPLOAD FOR RATINGS ===== */
    async function uploadAllRowsToGoogle() {
      if (!GAS_ENDPOINT_RATING || GAS_ENDPOINT_RATING.startsWith('PASTE_')) {
        console.warn('No GAS endpoint configured.');
        return false;
      }
      try {
        const allData = jsPsych.data.get().values();
        
        const demoData = allData.find(d => d.task === 'demographics');
        const demographics = demoData?.response || {};
        
        const rows = allData
          .filter(d => d.task === 'rating')
          .map(d => {
            const { rt, rt_original, rt_after_audio, ...cleanData } = d;
            return {
              participant_id:     participantId || '',
              trial_index:        cleanData.trial_index,
              task:               cleanData.task,
              stimulus:           cleanData.stimulus || '',
              cuteness_rating:     cleanData.cuteness_rating ?? '',
              continue_conversation: cleanData.continue_conversation ?? '',
              response_choice:    cleanData.response_choice || '',
              other_text:         cleanData.other_text || '',
              time_elapsed:       cleanData.time_elapsed,
              trial_start_time:   cleanData.trial_start_time || '',
              response_time:      cleanData.response_time || '',
              user_agent:         cleanData.user_agent || navigator.userAgent,
              gender:             demographics.gender || '',
              birth_year:         demographics.birth_year || '',
              birth_month:        demographics.birth_month || '',
              native_lang:        demographics.native_lang || '',
              dialect:            demographics.dialect || '',
            
            };
          });

        await fetch(GAS_ENDPOINT_RATING, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rows)
        });
        console.log('Upload attempted. Check your Google Sheet.');
        return true;
      } catch (e) {
        console.warn('Upload error:', e);
        return false;
      }
    }

    /* ===== RUN EXPERIMENT ===== */
    if (jsPsych) {
      console.log('Starting experiment...');
      jsPsych.run([
        preload,
        welcome,
        demographics,
        mic_permission,
        intro_page,
        rating_block,
        end
      ]);
    } else {
      console.error('jsPsych not initialized');
    }
  </script>
</body>
</html>
